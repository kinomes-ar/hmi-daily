name: Fetch images and rebuild
on:
  push:
    branches: [main]
    paths: ['data/**', 'build.py', 'fetch_images.py']
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}
      - name: Fetch images and rebuild
        run: |
          python3 fetch_images.py
          python3 build.py standalone
      - name: Commit
        run: |
          git config user.name "kinomes-ar"
          git config user.email "kinomeartemis@gmail.com"
          git add -A
          git diff --staged --quiet || git commit -m "Rebuild site"
          git push
