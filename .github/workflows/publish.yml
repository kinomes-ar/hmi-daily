name: Fetch images and rebuild
on:
  push:
    branches: [main]
    paths: ['data/**', 'build.py', 'fetch_images.py']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch article images
        run: python3 fetch_images.py
      - name: Rebuild site
        run: python3 build.py standalone
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Fetch images, rebuild site"
          git push
