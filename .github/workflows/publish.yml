name: Fetch images and rebuild
on:
  push:
    branches: [main]
    paths: ['data/**', 'build.py', 'fetch_images.py']
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch images and rebuild
        run: |
          python3 fetch_images.py
          python3 build.py standalone
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Rebuild site"
          git push
